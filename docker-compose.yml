version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: url-shortener-backend
    ports:
      - "6000:6000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: url-shortener-frontend
    ports:
      - "6200:6200"
    depends_on:
      - backend
    restart: unless-stopped